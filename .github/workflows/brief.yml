name: Brief quotidien

on:
  # Deux créneaux UTC encadrant 07:00 Paris été/hiver ; une étape ne laisse
  # passer QUE l'exécution correspondant à 07 h locales (gère le changement
  # d'heure, EF-01) et absorbe les retards de déclencheur (R-03).
  schedule:
    - cron: "5 4 * * *"   # 06:05 hiver / 07:05 été (Paris)
    - cron: "5 5 * * *"   # 07:05 hiver / 08:05 été (Paris)
  workflow_dispatch:       # déclenchement manuel de rattrapage (EF-04)

concurrency:               # jamais deux exécutions concurrentes (EF-45)
  group: brief
  cancel-in-progress: false

permissions:
  contents: write          # committer public/ (MP3, image)

env:
  METEOFRANCE_APP_ID: ${{ secrets.METEOFRANCE_APP_ID }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
  GMAIL_USER: ${{ secrets.GMAIL_USER }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  MAIL_TO: ${{ secrets.MAIL_TO }}

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: Est-il 07 h à Paris ?
        id: gate
        run: |
          HEURE=$(TZ=Europe/Paris date +%H)
          echo "Heure locale Paris : ${HEURE}h"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HEURE" = "07" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Hors créneau 07 h — arrêt sans erreur."
          fi

      - name: Checkout
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - name: Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dépendances
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Météo (PNG + repli HTML + données)
        if: steps.gate.outputs.go == 'true'
        run: python -m scripts.build_weather

      - name: Collecte actualités (RSS + sports)
        if: steps.gate.outputs.go == 'true'
        run: python -m scripts.build_collecte

      - name: Rédaction (LLM + sports déterministes)
        if: steps.gate.outputs.go == 'true'
        run: python -m scripts.build_redaction

      - name: Rendu e-mail
        if: steps.gate.outputs.go == 'true'
        run: python -m scripts.build_email --brief data/brief.json

      - name: Cache des voix Piper (évite un retéléchargement HuggingFace)
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-voices-v1

      - name: Pré-téléchargement des voix (une seule fois, puis cache)
        if: steps.gate.outputs.go == 'true'
        run: python -c "from src.audio.tts import prefetch_voices; prefetch_voices()"

      - name: Audio MP3 (edge-tts → repli Piper)
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        timeout-minutes: 6
        run: python -m scripts.build_audio

      - name: Publier public/ (image, MP3, e-mail) AVANT l'envoi
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add public/ data/collected.json data/brief.json data/history.json data/script_audio.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "chore: publication du brief quotidien"
            git push
          fi

      - name: Envoi e-mail (si secrets Gmail présents)
        if: steps.gate.outputs.go == 'true'
        run: python -m scripts.send_email
