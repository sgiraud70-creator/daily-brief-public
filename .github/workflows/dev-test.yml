name: Test dev (réel)

# Workflow temporaire de validation. Exécute la vraie collecte (météo + RSS) et,
# si la clé Mistral est présente, la rédaction puis le rendu e-mail avec le vrai
# contenu. Publie les résultats sur la branche et en artefacts.

on:
  push:
    branches: [claude/project-overview-kalf7c]
    paths-ignore: ["public/**", "data/collected.json", "data/brief.json", "data/history.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-test
  cancel-in-progress: true

env:
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
  METEOFRANCE_APP_ID: ${{ secrets.METEOFRANCE_APP_ID }}
  BRANCH_RAW: https://raw.githubusercontent.com/sgiraud70-creator/daily-brief-public/claude/project-overview-kalf7c/public

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: DEBUG sport (structure TheSportsDB, temporaire)
        run: python -m scripts.debug_sports

      - name: Météo réelle (Open-Meteo)
        run: python -m scripts.build_weather

      - name: Collecte actualités réelle (RSS)
        run: python -m scripts.build_collecte

      - name: Rédaction Mistral (si clé présente)
        if: ${{ env.MISTRAL_API_KEY != '' }}
        run: python -m scripts.build_redaction

      - name: Rendu e-mail avec vrai contenu (si brief)
        if: ${{ env.MISTRAL_API_KEY != '' }}
        run: python -m scripts.build_email --brief data/brief.json --weather-url "$BRANCH_RAW/weather.png" --mp3-url "$BRANCH_RAW/brief.mp3"

      - name: Cache des voix Piper (évite un retéléchargement HuggingFace)
        if: ${{ env.MISTRAL_API_KEY != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-voices-v1

      - name: Pré-téléchargement des voix (une seule fois, puis cache)
        if: ${{ env.MISTRAL_API_KEY != '' }}
        run: python -c "from src.audio.tts import prefetch_voices; prefetch_voices()"

      - name: Audio MP3 (edge-tts) — n'interrompt pas le run si le TTS échoue
        if: ${{ env.MISTRAL_API_KEY != '' }}
        continue-on-error: true
        timeout-minutes: 6
        run: python -m scripts.build_audio

      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: brief
          path: |
            public/weather.png
            public/email.html
            public/brief.mp3
            data/collected.json
            data/brief.json
            data/script_audio.txt

      - name: Publier sur la branche
        run: |
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add public/ data/collected.json data/brief.json data/history.json data/script_audio.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "test: brief réel (collecte + rédaction + e-mail)"
            git push
          fi
