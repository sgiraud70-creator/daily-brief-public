name: Test dev (réel)

# Workflow temporaire de validation : exécute la vraie collecte (météo + RSS)
# sur les runners GitHub (réseau ouvert), publie les résultats sur la branche
# et en artefacts. Remplace l'ancien meteo-test.yml.

on:
  push:
    branches: [claude/project-overview-kalf7c]
    paths-ignore: ["public/**", "data/collected.json", "data/history.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Météo réelle (Open-Meteo)
        run: python -m scripts.build_weather

      - name: Collecte actualités réelle (RSS)
        run: python -m scripts.build_collecte

      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: collecte
          path: |
            public/weather.png
            data/collected.json

      - name: Publier sur la branche
        run: |
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add public/ data/collected.json
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "test: météo + collecte RSS (données réelles)"
            git push
          fi
