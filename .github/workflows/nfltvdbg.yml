name: DEBUG NFL TV (temporaire)

# Diagnostic léger : capture la structure de la page NFL de tv-sports.fr et
# publie public/_nfltv_debug.txt. À SUPPRIMER une fois le parseur écrit.

on:
  push:
    branches: [claude/project-overview-kalf7c]
    paths: [scripts/debug_nfltv.py, .github/workflows/nfltvdbg.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfltvdbg
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-overview-kalf7c
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python -m scripts.debug_nfltv
      - name: Publier le diagnostic
        run: |
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          git add public/_nfltv_debug.txt
          if git diff --cached --quiet; then
            echo "Rien à publier."
          else
            git commit -m "debug(nfltv): dump structure page NFL tv-sports.fr"
            git push
          fi
